            font-family: 'Luckiest Guy', cursive;
            font-size: 2rem;
            color: #ff5555;
            margin-bottom: 0.8rem;
            filter: drop-shadow(0 0 12px rgba(255, 85, 85, 0.3));
            letter-spacing: 1px;
        }
 
        .error-message p {
            color: var(--text-dim);
            font-size: 1.1rem;
            font-weight: 600;
        }
 
        /* Animations */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(50px);
            }
        }
 
        @keyframes float-square {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(60px);
            }
        }
 
        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
 
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
 
        /* Scrollbar */
        .quick-play-sidebar::-webkit-scrollbar {
            width: 8px;
        }
 
        .quick-play-sidebar::-webkit-scrollbar-track {
            background: rgba(255, 140, 0, 0.08);
            border-radius: 10px;
        }
 
        .quick-play-sidebar::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.4), rgba(255, 100, 0, 0.3));
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.15);
        }
 
        .quick-play-sidebar::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.6), rgba(255, 100, 0, 0.5));
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.3);
        }
 
        /* Responsive */
        @media (max-width: 1200px) {
            .game-wrapper {
                flex-direction: column;
                gap: 1.5rem;
            }
 
            .quick-play-sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
            }
 
            .quick-play-games {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 0.5rem;
            }
 
            .quick-game-item {
                min-width: 130px;
                flex-shrink: 0;
            }
        }
 
        @media (max-width: 768px) {
            .game-wrapper {
                padding: 1.2rem;
                gap: 0.8rem;
            }
 
            .game-header {
                padding: 1.2rem;
                flex-wrap: wrap;
            }
 
            .game-title {
                font-size: 1.2rem;
            }
 
            .control-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.85rem;
            }
 
            .quick-play-sidebar {
                padding: 1.2rem;
            }
 
            .quick-play-title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="background-animation">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>
 
    <!-- Floating Squares Container -->
    <div id="squares-container"></div>
 
    <!-- Main Wrapper -->
    <div class="game-wrapper">
        <!-- Game Box -->
        <div class="game-box-container">
            <!-- Header -->
            <div class="game-header">
                <div class="game-header-left">
                    <a href="games.html" class="back-btn">← Back</a>
                    <div class="game-title">
                        <span class="game-title-icon">🎮</span>
                        <span id="gameTitle">Loading...</span>
                    </div>
                </div>
                <div class="game-controls">
                    <button class="control-btn" id="fullscreenBtn" title="Fullscreen (F)">⛶</button>
                    <button class="control-btn" id="reloadBtn" title="Reload (R)">🔄</button>
                </div>
            </div>
 
            <!-- Game Content -->
            <div class="game-content">
                <iframe id="gameFrame" sandbox="allow-same-origin allow-scripts allow-pointer-lock allow-popups allow-forms"></iframe>
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <div class="loading-text">LOADING GAME</div>
                    </div>
                </div>
                <div class="error-overlay" id="errorOverlay">
                    <div class="error-message">
                        <h2>⚠ Error Loading Game</h2>
                        <p>The game could not be loaded. Please try again.</p>
                    </div>
                </div>
            </div>
        </div>
 
        <!-- Quick Play Sidebar -->
        <div class="quick-play-sidebar">
            <div class="quick-play-title">⚡ QUICK PLAY</div>
            <div class="quick-play-games" id="quickPlayContainer">
                <!-- Games will be loaded here -->
            </div>
        </div>
    </div>
 
    <script>
        const gameFrame = document.getElementById('gameFrame');
        const gameTitle = document.getElementById('gameTitle');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorOverlay = document.getElementById('errorOverlay');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const reloadBtn = document.getElementById('reloadBtn');
        const gameBoxContainer = document.querySelector('.game-box-container');
        const gameWrapper = document.querySelector('.game-wrapper');
        const quickPlayContainer = document.getElementById('quickPlayContainer');
 
        let allGames = [];
        let isFullscreen = false;
 
        // Get game path from URL parameter (supports both ?game= and ?path=)
        function getGamePath() {
            const params = new URLSearchParams(window.location.search);
            return params.get('game') || params.get('path');
        }
 
        function getGameName() {
            const params = new URLSearchParams(window.location.search);
            return params.get('name') || 'Game';
        }
 
        // Initialize game
        async function initGame() {
            const gamePath = getGamePath();
            const gameName = getGameName();
            
            if (!gamePath) {
                showError('No game specified');
                return;
            }
 
            gameTitle.textContent = gameName;
            document.title = `${gameName} - Hotdog Party`;
 
            // Load games for quick play
            await loadQuickPlayGames();
 
            // Load game
            gameFrame.src = gamePath;
        }
 
        // Load games for quick play sidebar
        async function loadQuickPlayGames() {
            try {
                const response = await fetch('games.json');
                allGames = await response.json();
                renderQuickPlayGames();
            } catch (error) {
                console.error('Error loading games:', error);
            }
        }
 
        // Render quick play games
        function renderQuickPlayGames() {
            quickPlayContainer.innerHTML = '';
            
            allGames.slice(0, 5).forEach(game => {
                const gameItem = document.createElement('div');
                gameItem.className = 'quick-game-item';
                gameItem.style.cursor = 'pointer';
 
                const iconHTML = `
                    <div class="quick-game-icon">
                        <img src="${game.icon}" alt="${game.name}" onerror="this.parentElement.innerHTML='🎮'" loading="lazy">
                    </div>
                `;
 
                gameItem.innerHTML = `
                    ${iconHTML}
                    <div class="quick-game-name">${game.name}</div>
                `;
 
                gameItem.addEventListener('click', () => {
                    window.location.href = `game.html?path=${encodeURIComponent(game.path)}&name=${encodeURIComponent(game.name)}`;
                });
 
                quickPlayContainer.appendChild(gameItem);
            });
        }
 
        // Hide loading overlay
        gameFrame.addEventListener('load', () => {
            loadingOverlay.style.display = 'none';
        });
 
        // Show error if frame fails to load
        gameFrame.addEventListener('error', () => {
            showError('Failed to load the game');
        });
 
        // Handle timeout
        setTimeout(() => {
            if (loadingOverlay.style.display !== 'none') {
                showError('Game took too long to load');
            }
        }, 10000);
 
        function showError(message) {
            loadingOverlay.style.display = 'none';
            errorOverlay.style.display = 'flex';
            errorOverlay.querySelector('p').textContent = message;
        }
 
        // Fullscreen button
        fullscreenBtn.addEventListener('click', () => {
            if (!isFullscreen) {
                gameFrame.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });
 
        // Handle fullscreen changes
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                isFullscreen = true;
                document.body.classList.add('fullscreen-mode');
                fullscreenBtn.textContent = '⛶ ✓';
            } else {
                isFullscreen = false;
                document.body.classList.remove('fullscreen-mode');
                fullscreenBtn.textContent = '⛶';
            }
        });
 
        // Reload button
        reloadBtn.addEventListener('click', () => {
            loadingOverlay.style.display = 'flex';
            errorOverlay.style.display = 'none';
            gameFrame.src = gameFrame.src;
        });
 
        // Floating squares setup
        const squareSizes = [80, 100, 70, 90, 85, 75];
        const animationDurations = [
            { float: '6s', rotate: '8s', direction: 'normal' },
            { float: '7s', rotate: '10s', direction: 'reverse' },
            { float: '8s', rotate: '12s', direction: 'normal' },
            { float: '7.5s', rotate: '9s', direction: 'reverse' },
            { float: '6.5s', rotate: '11s', direction: 'normal' },
            { float: '7s', rotate: '8.5s', direction: 'reverse' }
        ];
 
        function getRandomPosition() {
            const randomTop = Math.random() * 100;
            const randomLeft = Math.random() * 100;
            return { top: randomTop, left: randomLeft };
        }
 
        function createFloatingSquares() {
            const container = document.getElementById('squares-container');
            
            squareSizes.forEach((size, index) => {
                const square = document.createElement('div');
                square.className = `floating-square square-${index + 1}`;
                
                const { top, left } = getRandomPosition();
                const duration = animationDurations[index];
                
                square.style.top = `${top}%`;
                square.style.left = `${left}%`;
                square.style.width = `${size}px`;
                square.style.height = `${size}px`;
                
                const floatDir = duration.direction === 'reverse' ? 'infinite reverse' : 'infinite';
                const rotateDir = duration.direction === 'reverse' ? 'infinite reverse' : 'infinite';
                
                square.style.animation = `float-square ${duration.float} ease-in-out ${floatDir}, rotate ${duration.rotate} linear ${rotateDir}`;
                
                container.appendChild(square);
            });
        }
 
        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            createFloatingSquares();
            initGame();
        });
 
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                fullscreenBtn.click();
            } else if (e.key === 'r' || e.key === 'R') {
                reloadBtn.click();
            }
        });
    </script>
</body>
</html>
