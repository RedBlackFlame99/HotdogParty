<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Devlogs – Hotdog Party</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
body{margin:0;padding-top:90px;font-family:"Segoe UI",system-ui,sans-serif;background:#121212;color:white;overflow-x:hidden;}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;}
.shape{position:absolute;width:60px;height:60px;background:linear-gradient(45deg,#ff7b00,#ffae00);opacity:.18;border-radius:14px;animation:float 18s linear infinite;}
@keyframes float{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-70px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
/* TOPBAR */
.topbar{position:fixed;top:0;left:0;width:100%;background:rgba(18,18,18,.97);backdrop-filter:blur(12px);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 24px rgba(0,0,0,.7);box-sizing:border-box;z-index:1000;border-bottom:1px solid rgba(255,140,0,.12);}
.top-center{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;color:#555;pointer-events:none;letter-spacing:.5px;}
.top-left{display:flex;align-items:center;cursor:pointer;background:rgba(255,140,0,.07);border:1px solid rgba(255,140,0,.18);border-radius:12px;padding:6px 14px 6px 10px;transition:.2s;text-decoration:none;}
.top-left:hover{background:rgba(255,140,0,.14);border-color:rgba(255,140,0,.35);box-shadow:0 0 14px rgba(255,140,0,.15);}
.logo-emoji{font-size:26px;animation:bounce 2s infinite;line-height:1;margin-right:8px;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.header-text{font-family:'Luckiest Guy';font-size:22px;background:linear-gradient(45deg,#ff7b00,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;}
.nav-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.nav-btn{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;text-decoration:none;color:#ddd;font-weight:600;font-size:14px;transition:.2s;border:1px solid transparent;}
.nav-btn:hover{background:#1e1e1e;border-color:#333;color:white;}
.nav-btn svg{width:20px;height:20px;opacity:.85;}
.games-nav-btn{background:linear-gradient(45deg,rgba(255,140,0,.15),rgba(255,200,0,.1));border-color:rgba(255,140,0,.35)!important;color:#ffb347;font-weight:700;}
.games-nav-btn svg{opacity:1;color:#ff8c00;}
.games-nav-btn:hover{background:linear-gradient(45deg,rgba(255,140,0,.28),rgba(255,200,0,.18))!important;border-color:#ff8c00!important;color:#ffd000!important;box-shadow:0 0 14px rgba(255,140,0,.3);}
.devlogs-nav-btn{background:linear-gradient(45deg,rgba(180,60,255,.15),rgba(120,40,220,.1));border-color:rgba(180,60,255,.35)!important;color:#cc88ff;font-weight:700;}
.devlogs-nav-btn:hover{background:linear-gradient(45deg,rgba(180,60,255,.28),rgba(120,40,220,.18))!important;border-color:#b44dff!important;color:#dd99ff!important;box-shadow:0 0 14px rgba(180,60,255,.3);}

/* DEVLOGS PAGE */
.devlogs-wrap{max-width:720px;margin:0 auto;padding:44px 24px 80px;}
.devlogs-hero{text-align:center;margin-bottom:52px;}
.devlogs-hero h1{font-family:'Luckiest Guy';font-size:clamp(48px,8vw,80px);margin:0;line-height:1.05;background:linear-gradient(135deg,#b44dff,#7b2fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 22px rgba(180,77,255,.45));letter-spacing:2px;}
.devlogs-hero p{font-size:17px;color:#888;margin:14px 0 0;}

/* TIMELINE */
.timeline{position:relative;padding-left:28px;}
.timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,#b44dff,rgba(180,77,255,.1));border-radius:2px;}
.entry{position:relative;margin-bottom:36px;}
.entry::before{content:'';position:absolute;left:-32px;top:22px;width:12px;height:12px;background:#b44dff;border-radius:50%;box-shadow:0 0 10px rgba(180,77,255,.6);border:2px solid #121212;}
.entry-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:18px;padding:26px 28px;transition:.2s;}
.entry-card:hover{border-color:rgba(180,77,255,.35);box-shadow:0 0 20px rgba(180,77,255,.1);}
.entry-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.entry-version{font-family:'Luckiest Guy';font-size:22px;background:linear-gradient(45deg,#b44dff,#7b2fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px;}
.entry-date{font-size:12px;font-weight:700;color:#555;letter-spacing:.8px;text-transform:uppercase;background:#252525;padding:4px 10px;border-radius:6px;white-space:nowrap;}
.entry-title{font-size:16px;font-weight:800;color:#ddd;margin-bottom:8px;}
.entry-body{font-size:14px;color:#888;line-height:1.7;}

/* LOADING / EMPTY */
.dl-loading{text-align:center;padding:60px 20px;color:#555;font-size:15px;}
.dl-loading-spinner{width:32px;height:32px;border:3px solid #2a2a2a;border-top-color:#b44dff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.dl-error{text-align:center;padding:40px;color:#ff5555;font-size:14px;}
</style>
</head>
<script src="notifications.js"></script>
<body>
<div class="bg" id="bg"></div>
<div class="topbar">
  <div class="top-center">Created by RedTheDev &amp; ControlMC</div>
  <a class="top-left" href="index.html">
    <div class="logo-emoji">🌭</div>
    <div class="header-text">Hotdog Party</div>
  </a>
  <div class="nav-right">
    <a class="nav-btn games-nav-btn" href="games.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M8 11v4M6 13h4"/><circle cx="16" cy="12" r="1" fill="currentColor"/><circle cx="18" cy="14" r="1" fill="currentColor"/></svg>
      Games
    </a>
    <a class="nav-btn devlogs-nav-btn" href="devlogs.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Devlogs
    </a>
    <a class="nav-btn" href="contact.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Contact
    </a>
  </div>
</div>

<div class="devlogs-wrap">
  <div class="devlogs-hero">
    <h1>📋 DEVLOGS</h1>
    <p>Every update, fix, and feature — straight from the dev.</p>
  </div>
  <div class="timeline" id="timeline">
    <div class="dl-loading">
      <div class="dl-loading-spinner"></div>
      Loading devlogs...
    </div>
  </div>
</div>

<script>
const bg = document.getElementById("bg");
for (let i = 0; i < 30; i++) {
  const s = document.createElement("div");
  s.className = "shape";
  s.style.left = Math.random() * 100 + "%";
  s.style.top  = Math.random() * 100 + "%";
  s.style.animationDuration = (Math.random() * 20 + 10) + "s";
  bg.appendChild(s);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function loadDevlogs() {
  const timeline = document.getElementById("timeline");
  try {
    const res  = await fetch("logs.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const logs = await res.json();
    if (!Array.isArray(logs) || !logs.length) {
      timeline.innerHTML = '<div class="dl-error">No devlogs found yet.</div>';
      return;
    }
    logs.sort((a, b) => b.id - a.id);
    timeline.innerHTML = logs.map(e => `
      <div class="entry">
        <div class="entry-card">
          <div class="entry-top">
            <span class="entry-version">${escHtml(e.version)}</span>
            <span class="entry-date">${escHtml(e.date)}</span>
          </div>
          ${e.title ? `<div class="entry-title">${escHtml(e.title)}</div>` : ""}
          <div class="entry-body">${escHtml(e.description)}</div>
        </div>
      </div>`).join("");
  } catch (err) {
    timeline.innerHTML = `<div class="dl-error">⚠️ Could not load devlogs.<br><small>${err.message}</small></div>`;
  }
}

loadDevlogs();
</script>
</body>
</html>
