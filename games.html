<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Games – Hotdog Party</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body{margin:0;padding-top:90px;font-family:"Segoe UI",system-ui,sans-serif;background:#0a0a0a;color:white;overflow-x:hidden;}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#0a0a0a 0%,#1a0800 50%,#0a0a0a 100%);}
.shape{position:absolute;width:60px;height:60px;background:linear-gradient(45deg,#ff7b00,#ffae00);opacity:.06;border-radius:14px;animation:float 18s linear infinite;filter:blur(2px) drop-shadow(0 0 16px rgba(255,140,0,.25));}
@keyframes float{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-70px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;width:100%;background:rgba(10,10,10,.98);backdrop-filter:blur(20px);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 32px rgba(0,0,0,.8),0 0 60px rgba(255,140,0,.15),inset 0 1px 0 rgba(255,140,0,.1);box-sizing:border-box;z-index:1000;border-bottom:2px solid rgba(255,140,0,.2);}
.top-center{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:#666;pointer-events:none;letter-spacing:1px;text-transform:uppercase;}
.top-left{display:flex;align-items:center;cursor:pointer;background:linear-gradient(135deg,rgba(255,140,0,.12),rgba(255,200,0,.06));border:2px solid rgba(255,140,0,.25);border-radius:14px;padding:8px 16px 8px 12px;transition:.3s;text-decoration:none;box-shadow:0 0 20px rgba(255,140,0,.1);}
.top-left:hover{background:linear-gradient(135deg,rgba(255,140,0,.22),rgba(255,200,0,.12));border-color:rgba(255,140,0,.6);box-shadow:0 0 30px rgba(255,140,0,.3);}
.logo-emoji{font-size:28px;animation:bounce 2s infinite;line-height:1;margin-right:10px;filter:drop-shadow(0 0 8px rgba(255,140,0,.4));}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.1)}}
.header-text{font-family:'Luckiest Guy';font-size:22px;background:linear-gradient(135deg,#ff7b00,#ffcc00,#ff7b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;}
.nav-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.nav-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;text-decoration:none;color:#ddd;font-weight:600;font-size:14px;transition:.3s;border:2px solid transparent;position:relative;}
.nav-btn::before{content:'';position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,rgba(255,140,0,.2),rgba(255,200,0,.1));opacity:0;transition:.3s;z-index:-1;}
.nav-btn:hover{color:white;border-color:rgba(255,140,0,.4);background:rgba(255,140,0,.08);}
.nav-btn:hover::before{opacity:1;}
.nav-btn svg{width:20px;height:20px;opacity:.9;filter:drop-shadow(0 0 4px rgba(255,140,0,.2));}
.games-nav-btn{background:linear-gradient(135deg,rgba(255,140,0,.2),rgba(255,200,0,.12));border-color:rgba(255,140,0,.4)!important;color:#ffb347;font-weight:700;}
.games-nav-btn svg{opacity:1;color:#ff8c00;filter:drop-shadow(0 0 6px rgba(255,140,0,.5));}
.games-nav-btn:hover{background:linear-gradient(135deg,rgba(255,140,0,.35),rgba(255,200,0,.22))!important;border-color:#ff8c00!important;color:#ffd000!important;box-shadow:0 0 20px rgba(255,140,0,.4);}

/* LAYOUT */
.games-layout{display:flex;justify-content:center;align-items:start;gap:28px;padding:28px 24px 0;position:relative;z-index:2;}

/* LEFT PANEL */
.games-left{flex:0 0 240px;position:sticky;top:110px;display:flex;flex-direction:column;gap:16px;}

/* Game of the Day */
.gotd-panel{background:linear-gradient(135deg,rgba(26,26,26,.95),rgba(42,18,0,.7));border:2px solid rgba(255,140,0,.25);border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,140,0,.1);}
.gotd-header{padding:14px 16px;background:linear-gradient(135deg,rgba(22,22,22,.9),rgba(30,15,0,.6));border-bottom:2px solid rgba(255,140,0,.15);display:flex;align-items:center;gap:10px;}
.gotd-header-title{font-family:'Luckiest Guy';font-size:17px;background:linear-gradient(135deg,#ff7b00,#ffcc00,#ff7b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;filter:drop-shadow(0 2px 8px rgba(255,140,0,.3));}
.gotd-body{padding:16px;}
.gotd-date{font-size:11px;color:#ff9933;margin-bottom:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-shadow:0 0 8px rgba(255,140,0,.2);}
.gotd-img-wrap{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;cursor:pointer;margin-bottom:12px;border:3px solid rgba(255,140,0,.15);transition:.3s;display:block;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.gotd-img-wrap::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,140,0,.2),transparent);opacity:0;transition:.3s;z-index:2;}
.gotd-img-wrap:hover{border-color:rgba(255,140,0,.6);box-shadow:0 12px 40px rgba(255,140,0,.4),0 0 40px rgba(255,140,0,.2);transform:scale(1.05);}
.gotd-img-wrap:hover::before{opacity:1;}
.gotd-img-wrap img{width:100%;height:100%;object-fit:cover;transition:.3s;filter:brightness(1);}
.gotd-img-wrap:hover img{filter:brightness(1.15) saturate(1.2);}
.gotd-name{font-size:14px;font-weight:800;color:#fff;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.gotd-play-btn{width:100%;padding:11px;background:linear-gradient(135deg,#ff8c00,#ffd000);border:none;border-radius:10px;color:#111;font-weight:900;font-size:13px;cursor:pointer;transition:.3s;text-decoration:none;display:block;text-align:center;box-shadow:0 6px 20px rgba(255,140,0,.4),0 0 20px rgba(255,140,0,.15);position:relative;overflow:hidden;font-family:'Luckiest Guy';}
.gotd-play-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.5s infinite;}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.gotd-play-btn:hover{transform:scale(1.05) translateY(-2px);box-shadow:0 8px 28px rgba(255,140,0,.6),0 0 30px rgba(255,140,0,.25);}

/* Recently Played */
.recent-panel{background:linear-gradient(135deg,rgba(26,26,26,.95),rgba(42,18,0,.7));border:2px solid rgba(255,140,0,.25);border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,140,0,.1);}
.recent-header{padding:14px 16px;background:linear-gradient(135deg,rgba(22,22,22,.9),rgba(30,15,0,.6));border-bottom:2px solid rgba(255,140,0,.15);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.recent-header-title{font-family:'Luckiest Guy';font-size:17px;background:linear-gradient(135deg,#ff7b00,#ffcc00,#ff7b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;filter:drop-shadow(0 2px 8px rgba(255,140,0,.3));}
.recent-clear{font-size:11px;font-weight:700;color:#ff8c00;background:rgba(255,140,0,.08);border:1px solid rgba(255,140,0,.2);cursor:pointer;padding:4px 10px;border-radius:8px;transition:.25s;letter-spacing:.3px;text-transform:uppercase;}
.recent-clear:hover{color:#ffd000;background:rgba(255,140,0,.2);border-color:rgba(255,140,0,.4);box-shadow:0 0 12px rgba(255,140,0,.2);}
.recent-list{padding:10px 0;}
.recent-row{display:flex;align-items:center;gap:12px;padding:10px 12px;text-decoration:none;transition:.2s;border-radius:8px;margin:2px 8px;}
.recent-row:hover{background:rgba(255,140,0,.12);box-shadow:inset 0 0 12px rgba(255,140,0,.1);}
.recent-icon{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;border:2px solid rgba(255,140,0,.2);transition:.2s;filter:brightness(1);}
.recent-row:hover .recent-icon{border-color:rgba(255,140,0,.5);filter:brightness(1.1);}
.recent-info{flex:1;min-width:0;}
.recent-name{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.4);}
.recent-sub{font-size:11px;color:#ff9933;margin-top:2px;font-weight:600;}
.recent-play{font-size:18px;flex-shrink:0;opacity:.4;transition:.2s;filter:drop-shadow(0 0 4px rgba(255,140,0,.2));}
.recent-row:hover .recent-play{opacity:1;color:#ffd000;filter:drop-shadow(0 0 8px rgba(255,140,0,.4));}
.recent-empty{padding:28px 16px;text-align:center;}
.recent-empty-icon{font-size:36px;margin-bottom:10px;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.recent-empty-text{font-size:12px;color:#ff9933;font-weight:600;line-height:1.6;}

/* CENTER */
.games-center{flex:0 1 950px;min-width:0;}

/* Search */
.search-container{position:relative;max-width:100%;margin-bottom:16px;}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:#ff8c00;pointer-events:none;opacity:.6;}
.search{width:100%;padding:13px 18px 13px 48px;border-radius:14px;border:2px solid rgba(255,140,0,.2);background:linear-gradient(135deg,rgba(26,26,26,.95),rgba(42,18,0,.6));color:#fff;font-size:15px;outline:none;transition:.3s;box-sizing:border-box;box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,140,0,.1);}
.search::placeholder{color:#888;}
.search:focus{border-color:rgba(255,140,0,.6);box-shadow:0 8px 32px rgba(255,140,0,.3),inset 0 1px 0 rgba(255,140,0,.2);background:linear-gradient(135deg,rgba(30,26,20,.98),rgba(50,22,0,.8));}

/* TAG FILTER BAR */
.tag-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;min-height:0;}
.tag-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:22px;border:2px solid rgba(255,140,0,.2);background:linear-gradient(135deg,rgba(26,26,26,.8),rgba(42,18,0,.5));color:#999;font-size:12px;font-weight:700;cursor:pointer;transition:.25s;white-space:nowrap;text-transform:capitalize;letter-spacing:.4px;box-shadow:0 4px 12px rgba(0,0,0,.3);}
.tag-btn:hover{border-color:rgba(255,140,0,.5);color:#ffb347;background:linear-gradient(135deg,rgba(40,30,15,.9),rgba(60,25,0,.6));box-shadow:0 6px 18px rgba(255,140,0,.15);}
.tag-btn.active{background:linear-gradient(135deg,rgba(255,140,0,.3),rgba(255,200,0,.15));border-color:rgba(255,140,0,.6);color:#ffd000;box-shadow:0 0 20px rgba(255,140,0,.3);}
.tag-btn .tag-count{font-size:10px;opacity:.7;font-weight:700;}

/* Games grid */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.no-games-msg{color:#888;font-size:15px;padding:48px 0;text-align:center;grid-column:1/-1;font-weight:600;}
.game{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#2a2a2a,#1a1a1a);transition:.3s;border:2px solid rgba(255,140,0,.15);text-decoration:none;display:block;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.game::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,140,0,.2),transparent);opacity:0;transition:.3s;z-index:2;}
.game:hover{transform:scale(1.1) translateY(-8px);border-color:rgba(255,140,0,.6);box-shadow:0 16px 48px rgba(255,140,0,.35),0 0 40px rgba(255,140,0,.2);}
.game:hover::before{opacity:1;}
.game img{width:100%;height:100%;object-fit:cover;transition:.3s;filter:brightness(1);}
.game:hover img{filter:brightness(1.25) saturate(1.35) drop-shadow(0 0 20px rgba(255,140,0,.3));}
.game .title{position:absolute;bottom:0;width:100%;text-align:center;background:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.7) 50%,rgba(0,0,0,0) 100%);padding:32px 10px 10px;opacity:0;transition:.3s;font-weight:700;font-size:13px;box-sizing:border-box;color:white;z-index:3;text-shadow:0 2px 8px rgba(0,0,0,.8);}
.game:hover .title{opacity:1;}

/* Leaderboard */
.games-right{flex:0 0 260px;position:sticky;top:110px;}
.leaderboard-panel{background:linear-gradient(135deg,rgba(26,26,26,.95),rgba(42,18,0,.7));border:2px solid rgba(255,140,0,.25);border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,140,0,.1);}
.lb-header{padding:16px 18px;border-bottom:2px solid rgba(255,140,0,.15);background:linear-gradient(135deg,rgba(22,22,22,.9),rgba(30,15,0,.6));display:flex;align-items:center;gap:10px;}
.lb-header-title{font-family:'Luckiest Guy';font-size:19px;background:linear-gradient(135deg,#ff7b00,#ffcc00,#ff7b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;flex:1;filter:drop-shadow(0 2px 8px rgba(255,140,0,.3));}
.lb-live-dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#ff8c00,#ffd000);box-shadow:0 0 12px #ff8c00,0 0 24px rgba(255,140,0,.5);animation:livePulse 1.6s ease-in-out infinite;}
@keyframes livePulse{0%,100%{box-shadow:0 0 12px #ff8c00,0 0 24px rgba(255,140,0,.5)}50%{box-shadow:0 0 20px #ff8c00,0 0 40px rgba(255,140,0,.8)}}
.lb-list{padding:10px 0;}
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 14px;transition:.2s;cursor:pointer;text-decoration:none;margin:2px 8px;border-radius:10px;}
.lb-row:hover{background:rgba(255,140,0,.1);box-shadow:inset 0 0 12px rgba(255,140,0,.08);}
.lb-rank{font-family:'Luckiest Guy';font-size:20px;width:30px;text-align:center;flex-shrink:0;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.lb-rank.gold{color:#ffd700;text-shadow:0 0 8px rgba(255,215,0,.4);}
.lb-rank.silver{color:#c0c0c0;text-shadow:0 0 8px rgba(192,192,192,.3);}
.lb-rank.bronze{color:#ffaa33;text-shadow:0 0 8px rgba(255,170,51,.3);}
.lb-rank.other{color:#ff8c00;}
.lb-icon{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;border:2px solid rgba(255,140,0,.2);transition:.2s;filter:brightness(1);}
.lb-row:hover .lb-icon{border-color:rgba(255,140,0,.5);filter:brightness(1.1);}
.lb-info{flex:1;min-width:0;}
.lb-name{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.4);}
.lb-plays{font-size:11px;color:#ff9933;margin-top:2px;font-weight:600;}
.lb-bar-wrap{height:4px;background:rgba(255,140,0,.1);border-radius:2px;margin-top:6px;overflow:hidden;box-shadow:inset 0 0 4px rgba(0,0,0,.5);}
.lb-bar{height:4px;background:linear-gradient(90deg,#ff7b00,#ffcc00,#ff7b00);border-radius:2px;transition:width .4s cubic-bezier(.25,.46,.45,.94);box-shadow:0 0 8px rgba(255,140,0,.4);}
.lb-empty{padding:28px 16px;text-align:center;color:#888;font-size:13px;font-weight:600;}

/* Scroll top */
.scroll-top{position:fixed;bottom:32px;right:32px;width:50px;height:50px;background:linear-gradient(135deg,#ff8c00,#ffd000);border:none;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(255,140,0,.6),0 0 40px rgba(255,140,0,.3);opacity:0;pointer-events:none;transform:translateY(20px);transition:.3s;z-index:999;}
.scroll-top.visible{opacity:1;pointer-events:auto;transform:translateY(0);}
.scroll-top:hover{transform:translateY(-6px) scale(1.1);box-shadow:0 12px 48px rgba(255,140,0,.8),0 0 60px rgba(255,140,0,.4);}
.scroll-top svg{width:24px;height:24px;color:#111;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
</style>
</head>
<script src="notifications.js"></script>

<script>
const FB_URL       = "https://hotdog-party-61e77-default-rtdb.firebaseio.com/plays";
const FB_DISABLED  = "https://hotdog-party-61e77-default-rtdb.firebaseio.com/disabled_games.json";

let allGames      = [];
let activeTag     = null;
let searchQuery   = "";

function gameURL(game) {
  return "game.html?path=" + encodeURIComponent(game.path) +
         "&name=" + encodeURIComponent(game.name) +
         "&icon=" + encodeURIComponent(game.icon);
}

/* ── GAME OF THE DAY ── */
function setupGameOfTheDay(games) {
  if (!games.length) return;
  const today = new Date();
  const seed  = today.getFullYear() * 10000 + (today.getMonth()+1) * 100 + today.getDate();
  const game  = games[seed % games.length];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("gotdDate").textContent = months[today.getMonth()] + " " + today.getDate() + ", " + today.getFullYear();
  document.getElementById("gotdImg").src  = game.icon;
  document.getElementById("gotdName").textContent = game.name;
  document.getElementById("gotdLink").href = gameURL(game);
  document.getElementById("gotdBtn").href  = gameURL(game);
}

/* ── RECENTLY PLAYED ── */
const RECENT_KEY = "hotdog_recent";
function loadRecentlyPlayed() {
  const container = document.getElementById("recentList");
  const clearBtn  = document.getElementById("recentClear");
  const recent    = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
  if (!recent.length) {
    clearBtn.style.display = "none";
    container.innerHTML = `<div class="recent-empty"><div class="recent-empty-icon">🎮</div><div class="recent-empty-text">No games played yet.<br>Jump in and start exploring!</div></div>`;
    return;
  }
  clearBtn.style.display = "";
  const now = Date.now();
  container.innerHTML = recent.map(g => {
    const url = gameURL(g);
    const age = now - (g.ts || 0);
    const sub = age < 60000 ? "Just now" : age < 3600000 ? Math.floor(age/60000) + "m ago" : age < 86400000 ? Math.floor(age/3600000) + "h ago" : Math.floor(age/86400000) + "d ago";
    return `<a class="recent-row" href="${url}"><img class="recent-icon" src="${g.icon}" alt="${g.name}" onerror="this.style.opacity=.3"><div class="recent-info"><div class="recent-name">${g.name}</div><div class="recent-sub">${sub}</div></div><div class="recent-play">▶</div></a>`;
  }).join("");
}
function clearRecent() { localStorage.removeItem(RECENT_KEY); loadRecentlyPlayed(); }

/* ── LEADERBOARD ── */
async function loadLeaderboard(games) {
  try {
    const r    = await fetch(FB_URL + ".json");
    const data = await r.json();
    if (data) { renderLeaderboard(Object.values(data).filter(e=>e&&e.count).sort((a,b)=>b.count-a.count).slice(0,10), games); return; }
  } catch {}
  renderLeaderboard([], games);
}

function renderLeaderboard(entries, games) {
  const container = document.getElementById("lbList");
  if (!container) return;
  if (!entries || !entries.length) { container.innerHTML = '<div class="lb-empty">Play some games to start the leaderboard!</div>'; return; }
  const maxCount = entries[0].count;
  const medals   = ["🥇","🥈","🥉"];
  const classes  = ["gold","silver","bronze"];
  container.innerHTML = entries.map((e, i) => {
    const pct  = Math.round((e.count / maxCount) * 100);
    const game = games.find(g => g.path === e.path);
    const href = game ? gameURL(game) : "#";
    return `<a class="lb-row" href="${href}"><div class="lb-rank ${i<3?classes[i]:'other'}">${i<3?medals[i]:i+1}</div><img class="lb-icon" src="${e.icon}" alt="${e.name}" onerror="this.style.opacity=0"><div class="lb-info"><div class="lb-name">${e.name}</div><div class="lb-plays">${e.count===1?"1 play":e.count+" plays"}</div><div class="lb-bar-wrap"><div class="lb-bar" style="width:${pct}%"></div></div></div></a>`;
  }).join("");
}

/* ── TAG FILTER BAR ── */
function buildTagBar(games) {
  const tagBar = document.getElementById("tagBar");
  const tagCounts = {};
  games.forEach(g => {
    if (Array.isArray(g.tags)) {
      g.tags.forEach(t => {
        const tag = t.toLowerCase().trim();
        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
      });
    }
  });
  const tags = Object.keys(tagCounts).sort();
  if (!tags.length) { tagBar.innerHTML = ""; return; }

  const allBtn = `<button class="tag-btn active" data-tag="" onclick="selectTag('',this)">🎮 All <span class="tag-count">(${games.length})</span></button>`;
  const tagBtns = tags.map(tag =>
    `<button class="tag-btn" data-tag="${tag}" onclick="selectTag('${tag}',this)">${tag} <span class="tag-count">(${tagCounts[tag]})</span></button>`
  ).join("");
  tagBar.innerHTML = allBtn + tagBtns;
}

function selectTag(tag, el) {
  activeTag = tag || null;
  document.querySelectorAll(".tag-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  applyFilters();
}

/* ── GAMES GRID ── */
function applyFilters() {
  let games = allGames;
  if (searchQuery) {
    games = games.filter(g => g.name.toLowerCase().includes(searchQuery));
  }
  if (activeTag) {
    games = games.filter(g => Array.isArray(g.tags) && g.tags.map(t=>t.toLowerCase()).includes(activeTag));
  }
  renderGames(games);
}

function renderGames(games) {
  const container = document.getElementById("games");
  if (!games.length) {
    container.innerHTML = '<div class="no-games-msg">No games match your filter.</div>';
    return;
  }
  container.innerHTML = "";
  games.forEach(game => {
    const a = document.createElement("a");
    a.className = "game";
    a.href = gameURL(game);
    a.innerHTML = `<img src="${game.icon}"><div class="title">${game.name}</div>`;
    container.appendChild(a);
  });
}

/* ── SEARCH ── */
document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value.toLowerCase();
  applyFilters();
});

/* ── LOAD EVERYTHING ── */
async function loadGames() {
  try {
    const [gamesRes, disabledRes] = await Promise.all([
      fetch("games.json"),
      fetch(FB_DISABLED).catch(() => ({ json: async () => null }))
    ]);
    let games        = await gamesRes.json();
    const disabledData = await disabledRes.json();

    const disabledPaths = new Set(disabledData ? Object.values(disabledData) : []);

    games = games.filter(g => !disabledPaths.has(g.path));

    games.sort((a, b) => a.name.localeCompare(b.name));

    allGames = games;
    buildTagBar(games);
    renderGames(games);
    loadLeaderboard(games);
    setupGameOfTheDay(games);
    loadRecentlyPlayed();
  } catch(e) {
    console.error("Could not load games:", e);
  }
}

loadGames();

// Background shapes
const bg = document.getElementById("bg");
for (let i = 0; i < 40; i++) {
  const s = document.createElement("div");
  s.className = "shape";
  s.style.left = Math.random() * 100 + "%";
  s.style.top  = Math.random() * 100 + "%";
  s.style.animationDuration = (Math.random() * 25 + 15) + "s";
  s.style.animationDelay = (Math.random() * 5) + "s";
  bg.appendChild(s);
}

window.addEventListener("scroll", () => {
  document.getElementById("scrollTopBtn").classList.toggle("visible", window.scrollY > 300);
});
</script>
