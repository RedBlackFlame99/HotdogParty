<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact – Hotdog Party</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
body{margin:0;padding-top:90px;font-family:"Segoe UI",system-ui,sans-serif;background:#121212;color:white;overflow-x:hidden;}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;}
.shape{position:absolute;width:60px;height:60px;background:linear-gradient(45deg,#ff7b00,#ffae00);opacity:.18;border-radius:14px;animation:float 18s linear infinite;}
@keyframes float{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-70px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
/* TOPBAR */
.topbar{position:fixed;top:0;left:0;width:100%;background:rgba(18,18,18,.97);backdrop-filter:blur(12px);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 24px rgba(0,0,0,.7);box-sizing:border-box;z-index:1000;border-bottom:1px solid rgba(255,140,0,.12);}
.top-center{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;color:#555;pointer-events:none;letter-spacing:.5px;}
.top-left{display:flex;align-items:center;cursor:pointer;background:rgba(255,140,0,.07);border:1px solid rgba(255,140,0,.18);border-radius:12px;padding:6px 14px 6px 10px;transition:.2s;text-decoration:none;}
.top-left:hover{background:rgba(255,140,0,.14);border-color:rgba(255,140,0,.35);box-shadow:0 0 14px rgba(255,140,0,.15);}
.logo-emoji{font-size:26px;animation:bounce 2s infinite;line-height:1;margin-right:8px;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.header-text{font-family:'Luckiest Guy';font-size:22px;background:linear-gradient(45deg,#ff7b00,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;}
.nav-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.nav-btn{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;text-decoration:none;color:#ddd;font-weight:600;font-size:14px;transition:.2s;border:1px solid transparent;}
.nav-btn:hover{background:#1e1e1e;border-color:#333;color:white;}
.nav-btn svg{width:20px;height:20px;opacity:.85;}
.games-nav-btn{background:linear-gradient(45deg,rgba(255,140,0,.15),rgba(255,200,0,.1));border-color:rgba(255,140,0,.35)!important;color:#ffb347;font-weight:700;}
.games-nav-btn svg{opacity:1;color:#ff8c00;}
.games-nav-btn:hover{background:linear-gradient(45deg,rgba(255,140,0,.28),rgba(255,200,0,.18))!important;border-color:#ff8c00!important;color:#ffd000!important;box-shadow:0 0 14px rgba(255,140,0,.3);}
/* CONTACT */
.contact-wrap{max-width:560px;margin:60px auto 0;text-align:center;padding:0 20px 60px;}
.contact-wrap h2{font-family:'Luckiest Guy';font-size:48px;background:linear-gradient(45deg,#ff7b00,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 12px;}
.contact-wrap p{color:#888;font-size:16px;margin:0 0 48px;}
.contact-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:36px 40px;margin-bottom:20px;transition:.25s;text-align:left;}
.contact-card:hover{border-color:#ff8c00;box-shadow:0 0 22px rgba(255,140,0,.15);}
.contact-card-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:#666;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.contact-card-label svg{width:16px;height:16px;opacity:.6;}
.contact-email{font-size:22px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.copy-btn{background:rgba(255,140,0,.1);border:1px solid rgba(255,140,0,.3);color:#ff8c00;font-size:13px;font-weight:700;padding:7px 16px;border-radius:8px;cursor:pointer;transition:.2s;flex-shrink:0;}
.copy-btn:hover{background:rgba(255,140,0,.22);border-color:#ff8c00;}
.copy-btn.copied{background:rgba(0,200,100,.12);border-color:rgba(0,200,100,.4);color:#00c864;}
.recommend-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:linear-gradient(45deg,#ff8c00,#ffd000);color:#111;font-weight:900;font-size:17px;border:none;border-radius:14px;cursor:pointer;text-decoration:none;transition:.2s;box-shadow:0 4px 20px rgba(255,140,0,.35);margin-top:8px;box-sizing:border-box;}
.recommend-btn:hover{transform:scale(1.03);box-shadow:0 6px 28px rgba(255,140,0,.55);}
/* CHANGELOG BUTTON */
.changelog-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;background:transparent;color:#aaa;font-weight:800;font-size:16px;border:2px solid #2a2a2a;border-radius:14px;cursor:pointer;transition:.2s;box-sizing:border-box;margin-top:8px;}
.changelog-btn:hover{border-color:#ff8c00;color:#ff8c00;background:rgba(255,140,0,.06);box-shadow:0 0 18px rgba(255,140,0,.12);}
.changelog-btn svg{width:20px;height:20px;}
/* CHANGELOG MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal{background:#161616;border:1px solid #2e2e2e;border-radius:22px;width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.7);transform:translateY(24px) scale(.97);transition:transform .25s,opacity .25s;overflow:hidden;}
.modal-overlay.open .modal{transform:translateY(0) scale(1);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:26px 30px 20px;border-bottom:1px solid #242424;flex-shrink:0;}
.modal-title{font-family:'Luckiest Guy';font-size:28px;background:linear-gradient(45deg,#ff7b00,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;}
.modal-close{background:rgba(255,255,255,.06);border:1px solid #333;color:#aaa;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;}
.modal-close:hover{background:rgba(255,140,0,.15);border-color:#ff8c00;color:#ff8c00;}
.modal-body{overflow-y:auto;padding:24px 30px;display:flex;flex-direction:column;gap:16px;}
.modal-body::-webkit-scrollbar{width:6px;}
.modal-body::-webkit-scrollbar-track{background:transparent;}
.modal-body::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}
.modal-body::-webkit-scrollbar-thumb:hover{background:#ff8c00;}
.log-entry{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:14px;padding:20px 22px;transition:.2s;}
.log-entry:hover{border-color:rgba(255,140,0,.35);box-shadow:0 0 16px rgba(255,140,0,.08);}
.log-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.log-version{font-family:'Luckiest Guy';font-size:20px;background:linear-gradient(45deg,#ff7b00,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px;}
.log-date{font-size:12px;font-weight:700;color:#555;letter-spacing:.8px;text-transform:uppercase;background:#252525;padding:4px 10px;border-radius:6px;white-space:nowrap;}
.log-desc{font-size:14px;color:#999;line-height:1.65;}
.log-loading{text-align:center;color:#555;font-size:15px;padding:30px 0;}
.log-error{text-align:center;color:#ff5555;font-size:14px;padding:30px 0;}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="topbar">
  <div class="top-center">Created by RedTheDev &amp; ControlMC</div>
  <a class="top-left" href="index.html">
    <div class="logo-emoji">🌭</div>
    <div class="header-text">Hotdog Party</div>
  </a>
  <div class="nav-right">
    <a class="nav-btn games-nav-btn" href="games.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M8 11v4M6 13h4"/><circle cx="16" cy="12" r="1" fill="currentColor"/><circle cx="18" cy="14" r="1" fill="currentColor"/></svg>
      Games
    </a>
    <a class="nav-btn" href="contact.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Contact
    </a>
  </div>
</div>

<div class="contact-wrap">
  <h2>📬 Contact Us</h2>
  <p>Got questions, issues, or just want to say hey? Reach out below.</p>

  <div class="contact-card">
    <div class="contact-card-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      Email us
    </div>
    <div class="contact-email">
      <span>hotdogparty854@gmail.com</span>
      <button class="copy-btn" id="copyBtn" onclick="copyEmail()">Copy</button>
    </div>
  </div>

  <div class="contact-card">
    <div class="contact-card-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Suggest a game
    </div>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfYiXKpJ7o2cjKgrCvz6uNZ_lulE3e90rBCsKrtCXt4oQ1qoA/viewform?usp=publish-editor" target="_blank" class="recommend-btn">
      🎮 Recommendations
    </a>
  </div>

  <div class="contact-card">
    <div class="contact-card-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Site updates
    </div>
    <button class="changelog-btn" onclick="openChangelog()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      📋 View Changelog
    </button>
  </div>
</div>

<!-- CHANGELOG MODAL -->
<div class="modal-overlay" id="changelogOverlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="changelogModal">
    <div class="modal-header">
      <div class="modal-title">📋 Changelog</div>
      <button class="modal-close" onclick="closeChangelog()">✕</button>
    </div>
    <div class="modal-body" id="changelogBody">
      <div class="log-loading">Loading changelog...</div>
    </div>
  </div>
</div>

<script>
function copyEmail() {
  navigator.clipboard.writeText("hotdogparty854@gmail.com")
  const btn = document.getElementById("copyBtn")
  btn.textContent = "Copied!"
  btn.classList.add("copied")
  setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied") }, 2000)
}

const bg = document.getElementById("bg")
for (let i = 0; i < 30; i++) {
  const s = document.createElement("div")
  s.className = "shape"
  s.style.left = Math.random() * 100 + "%"
  s.style.top = Math.random() * 100 + "%"
  s.style.animationDuration = (Math.random() * 20 + 10) + "s"
  bg.appendChild(s)
}

let changelogLoaded = false
async function openChangelog() {
  document.getElementById("changelogOverlay").classList.add("open")
  document.body.style.overflow = "hidden"
  if (changelogLoaded) return
  changelogLoaded = true
  try {
    const res = await fetch("logs.json")
    if (!res.ok) throw new Error("HTTP " + res.status)
    const logs = await res.json()
    logs.sort((a, b) => b.id - a.id)
    renderChangelog(logs)
  } catch (err) {
    document.getElementById("changelogBody").innerHTML =
      `<div class="log-error">⚠️ Could not load changelog.<br><small>${err.message}</small></div>`
  }
}
function renderChangelog(logs) {
  if (!Array.isArray(logs) || logs.length === 0) {
    document.getElementById("changelogBody").innerHTML =
      `<div class="log-loading">No changelog entries found.</div>`
    return
  }
  document.getElementById("changelogBody").innerHTML = logs.map(entry => `
    <div class="log-entry">
      <div class="log-top">
        <span class="log-version">${escapeHtml(entry.version)}</span>
        <span class="log-date">${escapeHtml(entry.date)}</span>
      </div>
      <div class="log-desc">${escapeHtml(entry.description)}</div>
    </div>
  `).join("")
}
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
}
function closeChangelog() {
  document.getElementById("changelogOverlay").classList.remove("open")
  document.body.style.overflow = ""
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById("changelogOverlay")) closeChangelog()
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeChangelog()
})
</script>
</body>
</html>
