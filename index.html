<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotdog Party</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
body{margin:0;padding-top:90px;font-family:"Segoe UI",system-ui,sans-serif;background:#121212;color:white;overflow-x:hidden;}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;}
.shape{position:absolute;width:60px;height:60px;background:linear-gradient(45deg,#ff7b00,#ffae00);opacity:.18;border-radius:14px;animation:float 18s linear infinite;}
@keyframes float{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-70px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
/* TOPBAR */
.topbar{position:fixed;top:0;left:0;width:100%;background:rgba(18,18,18,.97);backdrop-filter:blur(12px);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 24px rgba(0,0,0,.7);box-sizing:border-box;z-index:1000;border-bottom:1px solid rgba(255,140,0,.12);}
.top-center{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;color:#555;pointer-events:none;letter-spacing:.5px;}
.top-left{display:flex;align-items:center;cursor:pointer;background:rgba(255,140,0,.07);border:1px solid rgba(255,140,0,.18);border-radius:12px;padding:6px 14px 6px 10px;transition:.2s;text-decoration:none;}
.top-left:hover{background:rgba(255,140,0,.14);border-color:rgba(255,140,0,.35);box-shadow:0 0 14px rgba(255,140,0,.15);}
.logo-emoji{font-size:26px;animation:bounce 2s infinite;line-height:1;margin-right:8px;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.header-text{font-family:'Luckiest Guy';font-size:22px;background:linear-gradient(45deg,#ff7b00,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;}
.nav-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.nav-btn{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;text-decoration:none;color:#ddd;font-weight:600;font-size:14px;transition:.2s;cursor:pointer;border:1px solid transparent;}
.nav-btn:hover{background:#1e1e1e;border-color:#333;color:white;}
.nav-btn svg{width:20px;height:20px;opacity:.85;}
.games-nav-btn{background:linear-gradient(45deg,rgba(255,140,0,.15),rgba(255,200,0,.1));border-color:rgba(255,140,0,.35)!important;color:#ffb347;font-weight:700;}
.games-nav-btn svg{opacity:1;color:#ff8c00;}
.games-nav-btn:hover{background:linear-gradient(45deg,rgba(255,140,0,.28),rgba(255,200,0,.18))!important;border-color:#ff8c00!important;color:#ffd000!important;box-shadow:0 0 14px rgba(255,140,0,.3);}
.devlogs-nav-btn{background:linear-gradient(45deg,rgba(180,60,255,.15),rgba(120,40,220,.1));border-color:rgba(180,60,255,.35)!important;color:#cc88ff;font-weight:700;}
.devlogs-nav-btn:hover{background:linear-gradient(45deg,rgba(180,60,255,.28),rgba(120,40,220,.18))!important;border-color:#b44dff!important;color:#dd99ff!important;box-shadow:0 0 14px rgba(180,60,255,.3);}


@keyframes mmSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
/* HOME */
.hero{text-align:center;padding:60px 20px 30px;}
.hero h1{font-family:'Luckiest Guy';font-size:clamp(56px,10vw,110px);margin:0;line-height:1.05;background:linear-gradient(135deg,#ff7b00 0%,#ffcc00 50%,#ff7b00 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 28px rgba(255,140,0,.5));letter-spacing:3px;}
.hero h1 .white{background:linear-gradient(135deg,#ffffff,#ffe8a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{font-size:20px;color:#aaa;margin:18px 0 32px;}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:center;}
.start-btn{display:inline-flex;align-items:center;padding:14px 34px;border:none;background:linear-gradient(45deg,#ff8c00,#ffd000);color:#111;font-weight:900;font-size:17px;border-radius:10px;cursor:pointer;transition:.2s;box-shadow:0 4px 20px rgba(255,140,0,.45);text-decoration:none;}
.start-btn:hover{transform:scale(1.06);box-shadow:0 6px 28px rgba(255,140,0,.65);}
/* MARCH MADNESS BANNER */
.mm-banner{position:relative;margin:36px 28px 12px;border-radius:22px;overflow:hidden;cursor:pointer;min-height:200px;display:flex;align-items:center;background:linear-gradient(135deg,#0d0d0d 0%,#1a0800 30%,#2b0c00 60%,#0d0d0d 100%);border:2px solid rgba(249,115,22,.4);box-shadow:0 0 40px rgba(249,115,22,.25),0 0 80px rgba(249,115,22,.1),inset 0 0 60px rgba(0,0,0,.6);text-decoration:none;animation:mmBorderPulse 2.5s ease-in-out infinite;transition:.25s;}
.mm-banner:hover{transform:scale(1.012);box-shadow:0 0 60px rgba(249,115,22,.5),0 0 120px rgba(249,115,22,.2);border-color:rgba(249,115,22,.9);}
@keyframes mmBorderPulse{0%,100%{box-shadow:0 0 40px rgba(249,115,22,.25),0 0 80px rgba(249,115,22,.1),inset 0 0 60px rgba(0,0,0,.6)}50%{box-shadow:0 0 60px rgba(249,115,22,.45),0 0 120px rgba(249,115,22,.2),inset 0 0 60px rgba(0,0,0,.6)}}
.mm-hoop{position:absolute;right:60px;top:50%;transform:translateY(-50%);opacity:.15;font-size:140px;line-height:1;pointer-events:none;filter:drop-shadow(0 0 30px rgba(249,115,22,1));animation:mmHoopGlow 2s ease-in-out infinite;}
@keyframes mmHoopGlow{0%,100%{opacity:.13}50%{opacity:.22}}
.mm-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.mm-p{position:absolute;width:6px;height:10px;border-radius:2px;opacity:0;animation:mmConfetti 3s linear infinite;}
@keyframes mmConfetti{0%{opacity:0;transform:translateY(-20px) rotate(0deg)}10%{opacity:.9}90%{opacity:.5}100%{opacity:0;transform:translateY(220px) rotate(720deg)}}
.mm-bracket{position:absolute;right:260px;top:50%;transform:translateY(-50%);display:flex;gap:10px;align-items:center;opacity:.35;pointer-events:none;}
.mm-brk-col{display:flex;flex-direction:column;gap:8px;}
.mm-brk-match{width:50px;height:22px;border-radius:5px;background:linear-gradient(90deg,rgba(249,115,22,.5),rgba(249,115,22,.2));border:1px solid rgba(249,115,22,.4);}
.mm-brk-line{width:16px;height:2px;background:rgba(249,115,22,.4);align-self:center;}
.mm-brk-col2 .mm-brk-match{height:52px;}.mm-brk-col3 .mm-brk-match{height:114px;}
.mm-trophy{position:absolute;right:170px;top:50%;transform:translateY(-50%);font-size:48px;opacity:.45;animation:mmTrophyBob 2s ease-in-out infinite;}
@keyframes mmTrophyBob{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(calc(-50% - 6px)) scale(1.08)}}
.mm-content{position:relative;z-index:2;padding:32px 40px;}
.mm-eyebrow{font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#f97316;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.mm-eyebrow::before,.mm-eyebrow::after{content:'';display:inline-block;height:2px;width:24px;background:linear-gradient(90deg,transparent,#f97316);}
.mm-eyebrow::after{background:linear-gradient(90deg,#f97316,transparent);}
.mm-title{font-family:'Luckiest Guy';font-size:clamp(40px,6vw,80px);line-height:1;margin:0 0 6px;background:linear-gradient(135deg,#fff 0%,#ffe4c4 35%,#f97316 65%,#c8410a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 20px rgba(249,115,22,.6));letter-spacing:2px;}
.mm-sub{font-size:17px;color:#ffb07a;font-weight:700;margin:8px 0 28px;letter-spacing:.4px;}
.mm-cta{display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border-radius:12px;background:linear-gradient(135deg,#e85d10,#f97316,#ffab30);color:#fff;font-weight:900;font-size:16px;letter-spacing:.5px;border:none;cursor:pointer;text-decoration:none;box-shadow:0 4px 24px rgba(249,115,22,.6),0 0 40px rgba(249,115,22,.2);animation:mmCtaPulse 1.8s ease-in-out infinite;transition:.2s;}
.mm-cta:hover{transform:scale(1.07);}
@keyframes mmCtaPulse{0%,100%{box-shadow:0 4px 24px rgba(249,115,22,.6),0 0 40px rgba(249,115,22,.2)}50%{box-shadow:0 4px 36px rgba(249,115,22,.9),0 0 70px rgba(249,115,22,.4)}}
.mm-cta-ball{font-size:22px;animation:mmSpin 1s linear infinite;display:inline-block;}
/* STATS */
.stats{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:52px 0 16px;}
.stat-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:18px;padding:28px 44px;text-align:center;min-width:130px;transition:.25s;}
.stat-card:hover{border-color:#ff8c00;box-shadow:0 0 20px rgba(255,140,0,.2);transform:translateY(-4px);}
.stat-num{font-family:'Luckiest Guy';font-size:52px;background:linear-gradient(45deg,#ff7b00,#ffae00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.stat-label{font-size:13px;color:#777;margin-top:8px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;}
.section-title{font-family:'Luckiest Guy';font-size:34px;margin:54px 0 20px;background:linear-gradient(45deg,#ff7b00,#ffae00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-block;padding:0 40px;}
/* BELT */
.belt-wrapper{position:relative;overflow:hidden;margin:0;padding:10px 0;}
.belt-wrapper::before,.belt-wrapper::after{content:'';position:absolute;top:0;bottom:0;width:100px;z-index:2;pointer-events:none;}
.belt-wrapper::before{left:0;background:linear-gradient(to right,#121212 20%,transparent);}
.belt-wrapper::after{right:0;background:linear-gradient(to left,#121212 20%,transparent);}
.belt-track{display:flex;gap:14px;width:max-content;animation:beltScroll 80s linear infinite;padding:4px 40px;}
.belt-wrapper:hover .belt-track{animation-play-state:paused;}
@keyframes beltScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.belt-card{position:relative;width:130px;height:130px;border-radius:12px;overflow:hidden;cursor:pointer;background:#1f1f1f;flex-shrink:0;transition:.2s;border:2px solid transparent;text-decoration:none;display:block;}
.belt-card:hover{transform:scale(1.08);border-color:#ff8c00;box-shadow:0 0 16px rgba(255,140,0,.4);}
.belt-card img{width:100%;height:100%;object-fit:cover;}
.belt-title{position:absolute;bottom:0;width:100%;text-align:center;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.45) 60%,rgba(0,0,0,0) 100%);padding:26px 6px 7px;opacity:0;transition:.22s;font-size:12px;font-weight:600;box-sizing:border-box;color:white;}
.belt-card:hover .belt-title{opacity:1;}
/* FEATURED GRID */
.featured-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin:16px 40px 28px;}
.featured-game{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;cursor:pointer;background:#1f1f1f;transition:.22s;border:2px solid transparent;text-decoration:none;display:block;}
.featured-game:hover{transform:scale(1.06);border-color:#ff8c00;box-shadow:0 0 22px rgba(255,140,0,.38);}
.featured-game img{width:100%;height:100%;object-fit:cover;}
.featured-game .ftitle{position:absolute;bottom:0;width:100%;text-align:center;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.45) 50%,rgba(0,0,0,0) 100%);padding:32px 8px 10px;opacity:0;transition:.25s;font-weight:600;font-size:14px;box-sizing:border-box;color:white;}
.featured-game:hover .ftitle{opacity:1;}
.hot-badge{position:absolute;top:8px;right:8px;background:linear-gradient(45deg,#ff4500,#ff8c00);color:white;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.view-all-btn{display:block;width:fit-content;margin:8px auto 20px;padding:12px 32px;border:2px solid #ff8c00;background:transparent;color:#ff8c00;font-weight:700;font-size:15px;border-radius:10px;cursor:pointer;transition:.2s;text-decoration:none;}
.view-all-btn:hover{background:#ff8c00;color:#111;}
.scroll-top{position:fixed;bottom:28px;right:28px;width:46px;height:46px;background:linear-gradient(45deg,#ff8c00,#ffd000);border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(255,140,0,.5);opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .25s,transform .25s;z-index:999;}
.scroll-top.visible{opacity:1;pointer-events:auto;transform:translateY(0);}
.scroll-top:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(255,140,0,.7);}
.scroll-top svg{width:22px;height:22px;color:#111;pointer-events:none;}
</style>
</head>
<script src="notifications.js"></script>
<body>
<div class="bg" id="bg"></div>
<div class="topbar">
  <div class="top-center">Created by RedTheDev &amp; ControlMC</div>
  <a class="top-left" href="index.html">
    <div class="logo-emoji">🌭</div>
    <div class="header-text">Hotdog Party</div>
  </a>
  <div class="nav-right">
    <a class="nav-btn games-nav-btn" href="games.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M8 11v4M6 13h4"/><circle cx="16" cy="12" r="1" fill="currentColor"/><circle cx="18" cy="14" r="1" fill="currentColor"/></svg>
      Games
    </a>
    <a class="nav-btn devlogs-nav-btn" href="devlogs.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Devlogs
    </a>
    <a class="nav-btn" href="contact.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      Contact
    </a>
  </div>
</div>

<div class="hero">
  <h1>THE <span class="white">HOTDOG</span> PARTY</h1>
  <p>Start having fun without realizing.</p>
  <div class="hero-btns">
    <a class="start-btn" href="games.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;vertical-align:middle;margin-right:10px;color:#111"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M8 11v4M6 13h4"/><circle cx="16" cy="12" r="1" fill="#111"/><circle cx="18" cy="14" r="1" fill="#111"/></svg>
      START GRINDING!
    </a>
  </div>
</div>

<div class="stats">
  <div class="stat-card"><div class="stat-num" id="stat-games">60+</div><div class="stat-label">Games</div></div>
  <div class="stat-card"><div class="stat-num">100%</div><div class="stat-label">Free</div></div>
  <div class="stat-card"><div class="stat-num">24/7</div><div class="stat-label">Online</div></div>
</div>

<div class="section-title">🎮 Browse Games</div>
<div class="belt-wrapper"><div class="belt-track" id="belt-track"></div></div>
<div class="featured-grid" id="featured-games"></div>
<a class="view-all-btn" href="games.html">View All Games →</a>

<button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
</button>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8834756347415656" crossorigin="anonymous"></script>
<script>
const FB_URL = "https://hotdog-party-61e77-default-rtdb.firebaseio.com/plays";
function shuffle(arr) { return [...arr].sort(()=>Math.random()-.5); }
function gameURL(g) { return "game.html?path="+encodeURIComponent(g.path)+"&name="+encodeURIComponent(g.name)+"&icon="+encodeURIComponent(g.icon); }

function renderBelt(games) {
  const track = document.getElementById("belt-track");
  const items = [...shuffle(games),...shuffle(games)];
  track.innerHTML = items.map(g=>`<a class="belt-card" href="${gameURL(g)}"><img src="${g.icon}" alt="${g.name}"><div class="belt-title">${g.name}</div></a>`).join("");
}
function renderFeatured(games) {
  const c = document.getElementById("featured-games");
  c.innerHTML="";
  games.slice(0,10).forEach((g,i) => {
    const badge = i===0?'<div class="hot-badge">🥇 #1</div>':i===1?'<div class="hot-badge">🥈 #2</div>':i===2?'<div class="hot-badge">🥉 #3</div>':`<div class="hot-badge">#${i+1}</div>`;
    const a=document.createElement("a"); a.className="featured-game"; a.href=gameURL(g);
    a.innerHTML=`<img src="${g.icon}">${badge}<div class="ftitle">${g.name}</div>`;
    c.appendChild(a);
  });
}
async function loadGames() {
  try {
    const res=await fetch("games.json"); const games=await res.json();
    document.getElementById("stat-games").textContent=games.length;
    renderBelt(games);
    try {
      const lbData=await (await fetch(FB_URL+".json")).json();
      if (lbData) {
        const featured=Object.values(lbData).filter(e=>e&&e.count&&e.path).sort((a,b)=>b.count-a.count).map(e=>games.find(g=>g.path===e.path)).filter(Boolean).slice(0,10);
        renderFeatured(featured);
      } else { renderFeatured(shuffle(games).slice(0,10)); }
    } catch { renderFeatured(shuffle(games).slice(0,10)); }
  } catch(e) { console.error("Could not load games.json:",e); }
}
loadGames();

const bg=document.getElementById("bg");
for(let i=0;i<30;i++){const s=document.createElement("div");s.className="shape";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDuration=(Math.random()*20+10)+"s";bg.appendChild(s);}

const COLORS=['#f97316','#fb923c','#fbbf24','#fff','#c8410a','#fde68a','#ea580c'];
const pC=document.getElementById("mmParticles");
for(let i=0;i<28;i++){const p=document.createElement("div");p.className="mm-p";p.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*10-5}%;background:${COLORS[Math.floor(Math.random()*COLORS.length)]};animation-delay:${Math.random()*3}s;animation-duration:${2.5+Math.random()*2}s;transform:rotate(${Math.random()*360}deg);width:${4+Math.random()*6}px;height:${8+Math.random()*8}px;`;pC.appendChild(p);}

window.addEventListener("scroll",()=>document.getElementById("scrollTopBtn").classList.toggle("visible",window.scrollY>300));
</script>
</body>
</html>
