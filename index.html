<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotdog Party</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body{margin:0;padding-top:90px;font-family:"Segoe UI",system-ui,sans-serif;background:#0a0a0a;color:white;overflow-x:hidden;}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#0a0a0a 0%,#1a0800 50%,#0a0a0a 100%);}
.shape{position:absolute;width:60px;height:60px;background:linear-gradient(45deg,#ff7b00,#ffae00);opacity:.08;border-radius:14px;animation:float 18s linear infinite;filter:blur(1px) drop-shadow(0 0 12px rgba(255,140,0,.3));}
@keyframes float{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-70px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}

.stars{position:absolute;width:100%;height:100%;pointer-events:none;}
.star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;opacity:.4;animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;width:100%;background:rgba(10,10,10,.98);backdrop-filter:blur(20px);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 32px rgba(0,0,0,.8),0 0 60px rgba(255,140,0,.15),inset 0 1px 0 rgba(255,140,0,.1);box-sizing:border-box;z-index:1000;border-bottom:2px solid rgba(255,140,0,.2);}
.top-center{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:#666;pointer-events:none;letter-spacing:1px;text-transform:uppercase;}
.top-left{display:flex;align-items:center;cursor:pointer;background:linear-gradient(135deg,rgba(255,140,0,.12),rgba(255,200,0,.06));border:2px solid rgba(255,140,0,.25);border-radius:14px;padding:8px 16px 8px 12px;transition:.3s;text-decoration:none;box-shadow:0 0 20px rgba(255,140,0,.1);}
.top-left:hover{background:linear-gradient(135deg,rgba(255,140,0,.22),rgba(255,200,0,.12));border-color:rgba(255,140,0,.6);box-shadow:0 0 30px rgba(255,140,0,.3);}
.logo-emoji{font-size:28px;animation:bounce 2s infinite;line-height:1;margin-right:10px;filter:drop-shadow(0 0 8px rgba(255,140,0,.4));}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.1)}}
.header-text{font-family:'Luckiest Guy';font-size:22px;background:linear-gradient(135deg,#ff7b00,#ffcc00,#ff7b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;text-shadow:0 0 20px rgba(255,140,0,.3);}
.nav-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.nav-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;text-decoration:none;color:#ddd;font-weight:600;font-size:14px;transition:.3s;border:2px solid transparent;position:relative;}
.nav-btn::before{content:'';position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,rgba(255,140,0,.2),rgba(255,200,0,.1));opacity:0;transition:.3s;z-index:-1;}
.nav-btn:hover{color:white;border-color:rgba(255,140,0,.4);background:rgba(255,140,0,.08);}
.nav-btn:hover::before{opacity:1;}
.nav-btn svg{width:20px;height:20px;opacity:.9;filter:drop-shadow(0 0 4px rgba(255,140,0,.2));}
.games-nav-btn{background:linear-gradient(135deg,rgba(255,140,0,.2),rgba(255,200,0,.12));border-color:rgba(255,140,0,.4)!important;color:#ffb347;font-weight:700;}
.games-nav-btn svg{opacity:1;color:#ff8c00;filter:drop-shadow(0 0 6px rgba(255,140,0,.5));}
.games-nav-btn:hover{background:linear-gradient(135deg,rgba(255,140,0,.35),rgba(255,200,0,.22))!important;border-color:#ff8c00!important;color:#ffd000!important;box-shadow:0 0 20px rgba(255,140,0,.4);}
.devlogs-nav-btn{background:linear-gradient(135deg,rgba(180,60,255,.15),rgba(120,40,220,.08));border-color:rgba(180,60,255,.3)!important;color:#dd99ff;font-weight:700;}
.devlogs-nav-btn svg{color:#b44dff;filter:drop-shadow(0 0 6px rgba(180,60,255,.4));}
.devlogs-nav-btn:hover{background:linear-gradient(135deg,rgba(180,60,255,.28),rgba(120,40,220,.15))!important;border-color:#b44dff!important;color:#eeaaff!important;box-shadow:0 0 20px rgba(180,60,255,.35);}

/* HOME */
.hero{text-align:center;padding:80px 20px 40px;position:relative;z-index:2;}
.hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse at center,rgba(255,140,0,.08) 0%,rgba(255,140,0,.02) 70%,transparent 100%);filter:blur(40px);pointer-events:none;}
.hero h1{font-family:'Luckiest Guy';font-size:clamp(56px,12vw,120px);margin:0;line-height:1.05;background:linear-gradient(135deg,#ff7b00 0%,#ffcc00 25%,#ff7b00 50%,#ffcc00 75%,#ff7b00 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 8px 32px rgba(255,140,0,.6));letter-spacing:4px;text-shadow:0 0 40px rgba(255,140,0,.4),0 0 80px rgba(255,140,0,.2);animation:titleGlow 3s ease-in-out infinite;}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 8px 32px rgba(255,140,0,.6))}50%{filter:drop-shadow(0 12px 40px rgba(255,140,0,.8))}}
.hero h1 .white{background:linear-gradient(135deg,#ffffff,#ffe8a0,#ffffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(255,255,255,.3));}
.hero p{font-size:22px;color:#ff9933;margin:24px 0 40px;font-weight:600;letter-spacing:1px;text-shadow:0 0 20px rgba(255,140,0,.3),0 2px 10px rgba(0,0,0,.5);animation:fadeInUp .8s ease-out;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.hero-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;align-items:center;}
.start-btn{display:inline-flex;align-items:center;padding:18px 42px;border:none;background:linear-gradient(135deg,#ff8c00,#ffd000,#ff8c00);color:#111;font-weight:900;font-size:18px;border-radius:14px;cursor:pointer;transition:.3s;box-shadow:0 8px 32px rgba(255,140,0,.6),0 0 40px rgba(255,140,0,.3),inset 0 1px 0 rgba(255,255,255,.2);text-decoration:none;position:relative;overflow:hidden;font-family:'Luckiest Guy';letter-spacing:1px;}
.start-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3s infinite;}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.start-btn:hover{transform:scale(1.08) translateY(-4px);box-shadow:0 12px 48px rgba(255,140,0,.8),0 0 60px rgba(255,140,0,.5);}
.start-btn:active{transform:scale(0.98);}

/* STATS */
.stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin:60px 0 20px;position:relative;z-index:2;}
.stat-card{background:linear-gradient(135deg,rgba(26,26,26,.9),rgba(42,18,0,.6));border:2px solid rgba(255,140,0,.25);border-radius:18px;padding:32px 48px;text-align:center;min-width:140px;transition:.4s;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,140,0,.1);}
.stat-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 50%,rgba(255,140,0,.1) 0%,transparent 70%);opacity:0;transition:.3s;}
.stat-card:hover{border-color:rgba(255,140,0,.6);background:linear-gradient(135deg,rgba(30,24,18,.95),rgba(50,22,0,.8));box-shadow:0 12px 48px rgba(255,140,0,.3),inset 0 1px 0 rgba(255,140,0,.2);transform:translateY(-6px);}
.stat-card:hover::before{opacity:1;}
.stat-num{font-family:'Luckiest Guy';font-size:56px;background:linear-gradient(135deg,#ff7b00,#ffcc00,#ff7b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;filter:drop-shadow(0 2px 12px rgba(255,140,0,.4));animation:countPulse 2s ease-in-out infinite;}
@keyframes countPulse{0%,100%{filter:drop-shadow(0 2px 12px rgba(255,140,0,.4))}50%{filter:drop-shadow(0 4px 20px rgba(255,140,0,.6))}}
.stat-label{font-size:13px;color:#ff9933;margin-top:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;text-shadow:0 0 10px rgba(255,140,0,.2);}
.section-title{font-family:'Luckiest Guy';font-size:38px;margin:64px 0 32px;background:linear-gradient(135deg,#ff7b00,#ffcc00,#ff7b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-block;padding:0 48px;position:relative;z-index:2;filter:drop-shadow(0 4px 20px rgba(255,140,0,.4));letter-spacing:2px;}
.section-title::before,.section-title::after{content:'';position:absolute;top:50%;width:24px;height:2px;background:linear-gradient(90deg,rgba(255,140,0,.6),transparent);}
.section-title::before{left:0;}
.section-title::after{right:0;background:linear-gradient(90deg,transparent,rgba(255,140,0,.6));}

/* BELT */
.belt-wrapper{position:relative;overflow:hidden;margin:0;padding:16px 0;}
.belt-wrapper::before,.belt-wrapper::after{content:'';position:absolute;top:0;bottom:0;width:140px;z-index:3;pointer-events:none;}
.belt-wrapper::before{left:0;background:linear-gradient(to right,#0a0a0a 20%,transparent);}
.belt-wrapper::after{right:0;background:linear-gradient(to left,#0a0a0a 20%,transparent);}
.belt-track{display:flex;gap:18px;width:max-content;animation:beltScroll 100s linear infinite;padding:8px 48px;}
.belt-wrapper:hover .belt-track{animation-play-state:paused;}
@keyframes beltScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.belt-card{position:relative;width:150px;height:150px;border-radius:16px;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#2a2a2a,#1a1a1a);flex-shrink:0;transition:.3s;border:3px solid rgba(255,140,0,.15);text-decoration:none;display:block;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.belt-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,140,0,.3),transparent);opacity:0;transition:.3s;}
.belt-card:hover{transform:scale(1.12) translateY(-8px);border-color:rgba(255,140,0,.6);box-shadow:0 16px 40px rgba(255,140,0,.4),0 0 40px rgba(255,140,0,.2);}
.belt-card:hover::before{opacity:1;}
.belt-card img{width:100%;height:100%;object-fit:cover;transition:.3s;filter:brightness(1);}
.belt-card:hover img{filter:brightness(1.2) saturate(1.3);}
.belt-title{position:absolute;bottom:0;width:100%;text-align:center;background:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.6) 60%,rgba(0,0,0,0) 100%);padding:28px 8px 8px;opacity:0;transition:.3s;font-size:13px;font-weight:700;box-sizing:border-box;color:white;text-shadow:0 0 10px rgba(255,140,0,.3);}
.belt-card:hover .belt-title{opacity:1;}

/* FEATURED GRID */
.featured-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;margin:24px 48px 32px;position:relative;z-index:2;}
.featured-game{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#2a2a2a,#1a1a1a);transition:.3s;border:3px solid rgba(255,140,0,.15);text-decoration:none;display:block;box-shadow:0 12px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,140,0,.1);}
.featured-game::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,140,0,.2),transparent);opacity:0;transition:.3s;z-index:2;}
.featured-game:hover{transform:scale(1.1) translateY(-10px);border-color:rgba(255,140,0,.7);box-shadow:0 20px 48px rgba(255,140,0,.4),0 0 50px rgba(255,140,0,.25),inset 0 1px 0 rgba(255,140,0,.2);}
.featured-game:hover::before{opacity:1;}
.featured-game img{width:100%;height:100%;object-fit:cover;transition:.3s;filter:brightness(1);}
.featured-game:hover img{filter:brightness(1.25) saturate(1.4) drop-shadow(0 0 20px rgba(255,140,0,.3));}
.ftitle{position:absolute;bottom:0;width:100%;text-align:center;background:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.7) 50%,rgba(0,0,0,0) 100%);padding:36px 10px 12px;opacity:0;transition:.3s;font-weight:700;font-size:15px;box-sizing:border-box;color:white;z-index:3;text-shadow:0 2px 8px rgba(0,0,0,.8);}
.featured-game:hover .ftitle{opacity:1;}
.hot-badge{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,#ff4500,#ff8c00,#ffd000);color:#111;font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;z-index:4;box-shadow:0 4px 16px rgba(255,140,0,.5),0 0 20px rgba(255,140,0,.3);transform:rotate(0deg);transition:.3s;font-family:'Luckiest Guy';}
.featured-game:hover .hot-badge{transform:rotate(-8deg) scale(1.1);}
.view-all-btn{display:block;width:fit-content;margin:16px auto 32px;padding:15px 40px;border:3px solid #ff8c00;background:linear-gradient(135deg,rgba(255,140,0,.08),rgba(255,200,0,.04));color:#ff8c00;font-weight:800;font-size:16px;border-radius:12px;cursor:pointer;transition:.3s;text-decoration:none;font-family:'Luckiest Guy';letter-spacing:1px;box-shadow:0 0 20px rgba(255,140,0,.2);position:relative;z-index:2;}
.view-all-btn:hover{background:linear-gradient(135deg,#ff8c00,#ffd000);color:#111;box-shadow:0 8px 32px rgba(255,140,0,.6),0 0 40px rgba(255,140,0,.3);transform:translateY(-4px);}

/* PARTICLES */
.particle-system{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.particle{position:absolute;pointer-events:none;}
.particle.spark{width:4px;height:4px;background:radial-gradient(circle,#ffcc00,#ff8c00);border-radius:50%;filter:drop-shadow(0 0 4px rgba(255,140,0,.8));}

/* SCROLL TOP */
.scroll-top{position:fixed;bottom:32px;right:32px;width:50px;height:50px;background:linear-gradient(135deg,#ff8c00,#ffd000);border:none;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(255,140,0,.6),0 0 40px rgba(255,140,0,.3);opacity:0;pointer-events:none;transform:translateY(20px);transition:.3s;z-index:999;}
.scroll-top.visible{opacity:1;pointer-events:auto;transform:translateY(0);}
.scroll-top:hover{transform:translateY(-6px) scale(1.1);box-shadow:0 12px 48px rgba(255,140,0,.8),0 0 60px rgba(255,140,0,.4);}
.scroll-top svg{width:24px;height:24px;color:#111;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
</style>
</head>
<script src="notifications.js"></script>
<body>
<div class="bg" id="bg"></div>
<div class="particle-system" id="particleSystem"></div>

<div class="topbar">
  <div class="top-center">Created by NightDev_ &amp; ControlMC</div>
  <a class="top-left" href="index.html">
    <div class="logo-emoji">🌭</div>
    <div class="header-text">Hotdog Party</div>
  </a>
  <div class="nav-right">
    <a class="nav-btn games-nav-btn" href="games.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M8 11v4M6 13h4"/><circle cx="16" cy="12" r="1" fill="currentColor"/><circle cx="18" cy="14" r="1" fill="currentColor"/></svg>
      Games
    </a>
  </div>
</div>

<div class="hero">
  <h1>THE <span class="white">HOTDOG</span> PARTY</h1>
  <div class="hero-btns">
    <a class="start-btn" href="games.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;margin-right:12px;color:#111"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M8 11v4M6 13h4"/><circle cx="16" cy="12" r="1" fill="#111"/><circle cx="18" cy="14" r="1" fill="#111"/></svg>
      PLAY NOW
    </a>
  </div>
</div>

<div class="stats">
  <div class="stat-card"><div class="stat-num" id="stat-games">60+</div><div class="stat-label">Games</div></div>
  <div class="stat-card"><div class="stat-num">100%</div><div class="stat-label">Free</div></div>
  <div class="stat-card"><div class="stat-num">24/7</div><div class="stat-label">Online</div></div>
</div>

<div class="section-title">🎮 Browse Games</div>
<div class="belt-wrapper"><div class="belt-track" id="belt-track"></div></div>
<div class="featured-grid" id="featured-games"></div>
<a class="view-all-btn" href="games.html">View All Games →</a>

<button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
</button>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8834756347415656" crossorigin="anonymous"></script>
<script>
const FB_URL = "https://hotdog-party-61e77-default-rtdb.firebaseio.com/plays";

function shuffle(arr) { return [...arr].sort(()=>Math.random()-.5); }
function gameURL(g) { return "game.html?path="+encodeURIComponent(g.path)+"&name="+encodeURIComponent(g.name)+"&icon="+encodeURIComponent(g.icon); }

function renderBelt(games) {
  const track = document.getElementById("belt-track");
  const items = [...shuffle(games),...shuffle(games)];
  track.innerHTML = items.map(g=>`<a class="belt-card" href="${gameURL(g)}"><img src="${g.icon}" alt="${g.name}"><div class="belt-title">${g.name}</div></a>`).join("");
}

function renderFeatured(games) {
  const c = document.getElementById("featured-games");
  c.innerHTML="";
  games.slice(0,12).forEach((g,i) => {
    const badgeText = i===0?'🥇 #1':i===1?'🥈 #2':i===2?'🥉 #3':`#${i+1}`;
    const badge = `<div class="hot-badge">${badgeText}</div>`;
    const a=document.createElement("a"); a.className="featured-game"; a.href=gameURL(g);
    a.innerHTML=`<img src="${g.icon}" alt="${g.name}">${badge}<div class="ftitle">${g.name}</div>`;
    c.appendChild(a);
  });
}

async function loadGames() {
  try {
    const res=await fetch("games.json"); const games=await res.json();
    document.getElementById("stat-games").textContent=games.length+"+";
    renderBelt(games);
    try {
      const lbData=await (await fetch(FB_URL+".json")).json();
      if (lbData) {
        const featured=Object.values(lbData).filter(e=>e&&e.count&&e.path).sort((a,b)=>b.count-a.count).map(e=>games.find(g=>g.path===e.path)).filter(Boolean).slice(0,12);
        renderFeatured(featured);
      } else { renderFeatured(shuffle(games).slice(0,12)); }
    } catch { renderFeatured(shuffle(games).slice(0,12)); }
  } catch(e) { console.error("Could not load games.json:",e); }
}
loadGames();

const bg=document.getElementById("bg");
for(let i=0;i<40;i++){
  const s=document.createElement("div");
  s.className="shape";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.animationDuration=(Math.random()*25+15)+"s";
  s.style.animationDelay=(Math.random()*5)+"s";
  bg.appendChild(s);
}

const COLORS=['#ff8c00','#ffcc00','#ff7b00','#ffd000','#ff6b00','#ffb347'];
const particleSystem=document.getElementById("particleSystem");

setInterval(()=>{
  const p=document.createElement("div");
  p.className="particle spark";
  p.style.left=Math.random()*100+"%";
  p.style.top=Math.random()*50+"%";
  p.style.background=`radial-gradient(circle,${COLORS[Math.floor(Math.random()*COLORS.length)]},rgba(255,140,0,0))`;
  const duration=Math.random()*3+2;
  p.style.animation=`particleFloat ${duration}s ease-out forwards`;
  particleSystem.appendChild(p);
  setTimeout(()=>p.remove(),duration*1000);
},200);

const style=document.createElement("style");
style.textContent=`@keyframes particleFloat{0%{opacity:1;transform:translateY(0) translateX(0) scale(1)}100%{opacity:0;transform:translateY(${Math.random()*300-150}px) translateX(${Math.random()*200-100}px) scale(0)}}`;
document.head.appendChild(style);

window.addEventListener("scroll",()=>document.getElementById("scrollTopBtn").classList.toggle("visible",window.scrollY>300));
</script>
</body>
</html>
